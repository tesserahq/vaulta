[project]
name = "vaulta"
version = "0.1.0"
description = ""
authors = [
    {name = "mustela",email = "ejankowski@gmail.com"}
]
packages = [
    { include = "app" }
]
readme = "README.md"
requires-python = ">=3.11"

[tool.poetry]
packages = [
    { include = "app" }
]

[tool.poetry.scripts]
dev = "run:dev"

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
fastapi = "v0.141.1"
python-dotenv = "^1.2.3"
gunicorn = "26.0.0"
faker = "40.39.0"

sqlalchemy = "~2.0.39"
sqlalchemy-json = "^0.7.0"
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.13"
alembic = "^1.15.1"

pydantic = {extras = ["email"], version = "^2.13.5"}
black = "^26.0.0"
ruff = "0.16.9"
pydantic-settings = "^2.9.1"
python-jose = "^3.3.0"

opentelemetry-instrumentation-fastapi = "^0.63b1"
opentelemetry-exporter-otlp-proto-grpc = "^1.39.1"
opentelemetry-sdk = "^1.39.1"
opentelemetry-instrumentation-sqlalchemy = "^0.63b1"
opentelemetry-instrumentation-logging = "^0.63b1"
opentelemetry-instrumentation-requests = "^0.63b1"
prometheus-client = ">=0.23.1"

requests = "^2.32.3"
httpx = "^0.28.0"
pyjwt = "^2.10.1"
fernet = "^1.0.1"
celery = "^5.5.2"
rollbar = "^1.3.0"
boto3 = "^1.43.102"
anthropic = "^0.109.0"
google-cloud-documentai = "^3.0.0"
itsdangerous = "^2.1.2"
zxing-cpp = "^3.0.0"
pillow = "^12.3.0"
pdf2image = "^1.17.0"
passporteye = "^2.2.2"
paddleocr = "^3.3.1"
cryptography = "^50.0.0"
# tessera-sdk = { path = "../tessera-sdk-py/", develop = true }
tessera-sdk = { git = "https://github.com/tesserahq/tessera-sdk-py.git", branch = "main" }
uvicorn = "0.53.0"
python-multipart = "^0.0.32"
fastapi-pagination = "^0.15.16"
prometheus-fastapi-instrumentator = "^8.0.2"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-asyncio = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"